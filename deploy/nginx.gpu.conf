server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Docker's DNS. Resolving at request time lets nginx start even if vllm is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # 200 = vLLM is serving on the AMD GPU. 503 = not available (yet).
  location = /gpu-health {
    auth_request /_vllm_health;
    error_page 401 403 500 502 503 504 = @gpu_down;
    default_type application/json;
    add_header Cache-Control no-store always;
    alias /etc/nginx/gpu/gpu-available.json;
  }

  location = /_vllm_health {
    internal;
    set $vllm http://vllm:8000;
    proxy_pass $vllm/health;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location @gpu_down {
    default_type application/json;
    return 503 '{"gpu":"unavailable","engine":"vllm-rocm"}\n';
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
