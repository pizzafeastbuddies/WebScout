# AMD GPU (ROCm) add-on. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Without this file WebScout runs on CPU exactly as before.
services:
  vllm:
    # MI300X = gfx942 (CDNA3). The container's ROCm must be supported by the
    # host amdgpu driver; override VLLM_IMAGE if `amd-smi version` says otherwise.
    image: ${VLLM_IMAGE:-rocm/vllm:rocm7.14.1_cdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0}
    command:
      - vllm
      - serve
      - ${MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      HF_HOME: /models
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    volumes:
      - ${MODELS_DIR:-./models}:/models
    # Not published to the internet. Reach it via `ssh -L 8000:localhost:8000`.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 900s
    restart: unless-stopped

  webscout:
    volumes:
      - ./deploy/nginx.gpu.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/gpu-available.json:/etc/nginx/gpu/gpu-available.json:ro
